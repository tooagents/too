<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MCP Flow Demo</title>
    <style>
        :root {
            --bg: #f2efe8;
            --panel: #fffdf8;
            --ink: #1a1f16;
            --accent: #1f6d52;
            --muted: #5a6257;
            --edge: #d8d2c4;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, sans-serif;
            color: var(--ink);
            background: radial-gradient(circle at 15% 20%, #e4efe9, transparent 40%), var(--bg);
        }

        main {
            max-width: 840px;
            margin: 32px auto;
            padding: 20px;
            background: var(--panel);
            border: 1px solid var(--edge);
            border-radius: 14px;
        }

        h1 {
            margin-top: 0;
        }

        form {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }

        input {
            flex: 1;
            min-width: 220px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--edge);
            font-size: 14px;
        }

        button {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            color: white;
            background: var(--accent);
            cursor: pointer;
        }

        pre {
            margin-top: 16px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--edge);
            background: #f8f6f1;
            overflow: auto;
            white-space: pre-wrap;
            color: var(--muted);
        }

        .section {
            border-top: 1px solid var(--edge);
            margin-top: 16px;
            padding-top: 16px;
        }
    </style>
</head>

<body>
    <main>
        <h1>Tiny MCP Flow Demo 1</h1>
        <p>Use the small forms below to test each step separately.</p>

        <div class="section">
            <h3>Step 1: Agent Health</h3>
            <form id="health-form">
                <button type="submit">GET /health</button>
            </form>
        </div>

        <div class="section">
            <h3>Step 2: MCP Diagnostics</h3>
            <form id="diagnose-form">
                <button type="submit">GET /diagnose_mcp</button>
            </form>
        </div>

        <div class="section">
            <h3>Step 3: Direct MCP Tool Run</h3>
            <form id="run-tool-form">
                <input id="tool" value="tool1" />
                <input id="args" value='{"message":"hello from test"}' />
                <button type="submit">POST /run_tool</button>
            </form>
        </div>

        <div class="section">
            <h3>Step 4: Chat Flow</h3>
            <form id="chat-form">
                <input id="tool-choice" value="auto" />
                <input id="msg" placeholder="Ask something..." value="vendor: acme supplies" />
                <input id="chat-args" value="{}" />
                <button type="submit">POST /chat</button>
            </form>
        </div>

        <pre id="out">Waiting...</pre>
    </main>

    <script>
        const healthForm = document.getElementById('health-form');
        const diagnoseForm = document.getElementById('diagnose-form');
        const runToolForm = document.getElementById('run-tool-form');
        const chatForm = document.getElementById('chat-form');
        const input = document.getElementById('msg');
        const toolChoiceInput = document.getElementById('tool-choice');
        const chatArgsInput = document.getElementById('chat-args');
        const toolInput = document.getElementById('tool');
        const argsInput = document.getElementById('args');
        const out = document.getElementById('out');

        function render(title, data) {
            const stamp = new Date().toISOString();
            const entry = `[${stamp}] ${title}\n${JSON.stringify(data, null, 2)}\n\n`;
            out.textContent = entry;
        }

        async function callApi(title, url, options = {}) {
            render(title, { status: 'Running...' });
            try {
                const response = await fetch(url, options);
                const rawText = await response.text();
                let data;
                try {
                    data = rawText ? JSON.parse(rawText) : {};
                } catch {
                    data = { raw: rawText };
                }
                render(`${title} (HTTP ${response.status})`, data);
            } catch (error) {
                render(`${title} (fetch error)`, { error: String(error) });
            }
        }

        healthForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            await callApi('Step 1: GET /health', '/health');
        });

        diagnoseForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            await callApi('Step 2: GET /diagnose_mcp', '/diagnose_mcp');
        });

        runToolForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            let parsedArgs;
            try {
                parsedArgs = JSON.parse(argsInput.value);
            } catch (error) {
                render('Step 3: invalid JSON in arguments', { error: String(error) });
                return;
            }
            await callApi('Step 3: POST /run_tool', '/run_tool', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ tool: toolInput.value, arguments: parsedArgs })
            });
        });

        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            let parsedArgs;
            try {
                parsedArgs = JSON.parse(chatArgsInput.value);
            } catch (error) {
                render('Step 4: invalid JSON in arguments', { error: String(error) });
                return;
            }
            await callApi('Step 4: POST /chat', '/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    tool_choice: toolChoiceInput.value,
                    arguments: {
                        message: input.value,
                        ...parsedArgs
                    }
                })
            });
        });
    </script>
</body>

</html>
